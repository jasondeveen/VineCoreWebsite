<section id="services" class="bg-neutral-50 dark:bg-neutral-900/40">
  <div class="mx-auto max-w-6xl px-4 py-16 sm:px-6 sm:py-24">
    <p class="text-sm font-semibold uppercase tracking-widest text-emerald-700 dark:text-emerald-400">
      {{ i18n.t('services.eyebrow') }}
    </p>
    <h2 class="mt-2 text-3xl font-bold tracking-tight text-neutral-900 dark:text-neutral-100 sm:text-4xl">
      {{ i18n.t('services.title') }}
    </h2>
    <div class="mt-10 grid gap-8 md:grid-cols-2 lg:grid-cols-3">
      @for (card of cards; track card.titleKey) {
        <div
          class="rounded-xl border border-neutral-200 bg-white p-8 shadow-sm dark:border-neutral-800 dark:bg-neutral-900"
        >
          <h3 class="text-xl font-semibold text-neutral-900 dark:text-neutral-100">
            {{ i18n.t(card.titleKey) }}
          </h3>
          <p class="mt-3 text-neutral-600 dark:text-neutral-400">{{ i18n.t(card.bodyKey) }}</p>
        </div>
      }
    </div>
  </div>
</section>
