<header
  class="sticky top-0 z-50 border-b border-neutral-200 bg-white/80 backdrop-blur dark:border-neutral-800 dark:bg-neutral-950/80"
>
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-3 px-4 sm:px-6">
    <a href="#top" class="flex shrink-0 items-center" [attr.aria-label]="i18n.t('nav.home')">
      <img
        src="/vinecore-logo-trim-no-bg.png"
        alt="VineCore"
        class="h-10 w-auto dark:invert dark:hue-rotate-180"
      />
    </a>

    <div class="flex items-center gap-2 sm:gap-4">
      <nav
        class="hidden items-center gap-6 text-sm font-medium text-neutral-600 md:flex lg:gap-8 dark:text-neutral-300"
      >
        <a href="#about" class="transition hover:text-emerald-700 dark:hover:text-emerald-400">
          {{ i18n.t('nav.about') }}
        </a>
        <a href="#services" class="transition hover:text-emerald-700 dark:hover:text-emerald-400">
          {{ i18n.t('nav.services') }}
        </a>
        <a href="#projects" class="transition hover:text-emerald-700 dark:hover:text-emerald-400">
          {{ i18n.t('nav.projects') }}
        </a>
        <a
          href="#contact"
          class="rounded-md bg-emerald-600 px-4 py-2 font-semibold text-white transition hover:bg-emerald-700"
        >
          {{ i18n.t('nav.contact') }}
        </a>
      </nav>

      <!-- Language switcher -->
      <div
        class="flex items-center gap-0.5 rounded-md border border-neutral-200 p-0.5 dark:border-neutral-800"
        role="group"
        [attr.aria-label]="i18n.t('nav.language')"
      >
        <button
          type="button"
          lang="en"
          (click)="i18n.setLang('en')"
          [attr.aria-pressed]="i18n.lang() === 'en'"
          [class]="
            i18n.lang() === 'en'
              ? 'rounded bg-neutral-900 px-2 py-1 text-xs font-semibold text-white transition-colors dark:bg-neutral-100 dark:text-neutral-900'
              : 'rounded px-2 py-1 text-xs font-semibold text-neutral-500 transition-colors hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-neutral-100'
          "
        >
          EN
        </button>
        <button
          type="button"
          lang="nl"
          (click)="i18n.setLang('nl')"
          [attr.aria-pressed]="i18n.lang() === 'nl'"
          [class]="
            i18n.lang() === 'nl'
              ? 'rounded bg-neutral-900 px-2 py-1 text-xs font-semibold text-white transition-colors dark:bg-neutral-100 dark:text-neutral-900'
              : 'rounded px-2 py-1 text-xs font-semibold text-neutral-500 transition-colors hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-neutral-100'
          "
        >
          NL
        </button>
      </div>

      <!-- Theme switcher -->
      <button
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="
          theme.isDark() ? i18n.t('nav.themeToLight') : i18n.t('nav.themeToDark')
        "
        class="rounded-md border border-neutral-200 p-2 text-neutral-600 transition hover:text-emerald-700 dark:border-neutral-800 dark:text-neutral-400 dark:hover:text-emerald-400"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4 dark:hidden"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
          />
        </svg>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="hidden h-4 w-4 dark:block"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
          />
        </svg>
      </button>

      <!-- No room for a CTA on the smallest screens; the hero has one. -->
      <a
        href="#contact"
        class="hidden rounded-md bg-emerald-600 px-3 py-2 text-sm font-semibold text-white transition hover:bg-emerald-700 sm:inline-flex md:hidden"
      >
        {{ i18n.t('nav.contact') }}
      </a>
    </div>
  </div>
</header>
