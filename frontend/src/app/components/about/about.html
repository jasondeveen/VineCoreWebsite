<section id="about" class="bg-white dark:bg-neutral-950">
  <div class="mx-auto max-w-6xl px-4 py-16 sm:px-6 sm:py-24">
    <div class="grid max-w-2xl gap-10">
      <div>
        <p class="text-sm font-semibold uppercase tracking-widest text-emerald-700 dark:text-emerald-400">
          {{ i18n.t('about.eyebrow') }}
        </p>
        <h2
          class="mt-2 text-3xl font-bold tracking-tight text-neutral-900 dark:text-neutral-100 sm:text-4xl"
        >
          {{ i18n.t('about.title') }}
        </h2>
        <div class="mt-6 space-y-4 text-neutral-600 dark:text-neutral-400">
          <p>{{ i18n.t('about.p1') }}</p>
          <p>{{ i18n.t('about.p2') }}</p>
          <p>{{ i18n.t('about.p3') }}</p>
        </div>

        <a
          href="https://www.linkedin.com/in/jasondeveen/"
          target="_blank"
          rel="noopener noreferrer"
          class="group mt-8 flex items-center justify-between gap-4 rounded-xl border border-neutral-200 bg-neutral-50 p-6 shadow-sm transition hover:border-emerald-300 hover:shadow-md dark:border-neutral-800 dark:bg-neutral-900 dark:hover:border-emerald-700"
        >
          <div class="flex items-center gap-4">
            <span
              class="flex h-10 w-10 items-center justify-center rounded-full bg-emerald-50 text-emerald-600 dark:bg-emerald-950 dark:text-emerald-400"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
                />
              </svg>
            </span>
            <div>
              <p class="text-sm font-medium text-neutral-500 dark:text-neutral-400">LinkedIn</p>
              <p
                class="mt-0.5 text-lg font-semibold text-neutral-900 group-hover:text-emerald-700 dark:text-neutral-100 dark:group-hover:text-emerald-400"
              >
                jasondeveen
              </p>
            </div>
          </div>
          <span
            aria-hidden="true"
            class="text-xl text-emerald-600 transition group-hover:translate-x-1 dark:text-emerald-400"
          >
            &rarr;
          </span>
        </a>
      </div>

      <!-- TODO: replace this placeholder with a portrait photo of Jason.
           Vertical, e.g. 900 x 1200 px, saved to public/about/portrait.jpg.
           The placeholder is hidden until that photo exists. To restore it:
           remove `hidden`, add `flex`, and change the wrapper above back to
           `grid gap-10 md:grid-cols-[1.4fr_1fr] md:gap-16` (drop max-w-2xl). -->
      <div
        class="hidden aspect-[3/4] w-full max-w-xs flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-neutral-300 bg-neutral-50 p-6 text-center text-sm text-neutral-400 md:aspect-auto md:h-full dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-500"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-8 w-8"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z"
          />
        </svg>
        <span class="font-medium text-neutral-500 dark:text-neutral-400">
          {{ i18n.t('about.portraitTitle') }}
        </span>
        <span>{{ i18n.t('about.portraitMeta') }}</span>
      </div>
    </div>
  </div>
</section>
