<section id="contact" class="bg-neutral-50 dark:bg-neutral-900/40">
  <div class="mx-auto max-w-6xl px-4 py-16 sm:px-6 sm:py-24">
    <div class="flex flex-col items-center text-center">
      <p class="text-sm font-semibold uppercase tracking-widest text-emerald-700 dark:text-emerald-400">
        {{ i18n.t('contact.eyebrow') }}
      </p>
      <h2 class="mt-2 text-3xl font-bold tracking-tight text-neutral-900 dark:text-neutral-100 sm:text-4xl">
        {{ i18n.t('contact.title') }}
      </h2>
      <p class="mt-4 max-w-md text-neutral-600 dark:text-neutral-400">
        {{ i18n.t('contact.body') }}
      </p>

      <a
        href="mailto:info@vinecore.be"
        class="group mt-8 flex w-full max-w-md items-center justify-between gap-4 rounded-xl border border-neutral-200 bg-white p-6 text-left transition hover:border-emerald-300 hover:shadow-sm dark:border-neutral-800 dark:bg-neutral-900 dark:hover:border-emerald-700"
      >
        <div class="flex items-center gap-4">
          <span
            class="flex h-10 w-10 items-center justify-center rounded-full bg-emerald-50 text-emerald-600 dark:bg-emerald-950 dark:text-emerald-400"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"
              />
            </svg>
          </span>
          <div>
            <p class="text-sm font-medium text-neutral-500 dark:text-neutral-400">
              {{ i18n.t('contact.emailLabel') }}
            </p>
            <p
              class="mt-0.5 text-lg font-semibold text-neutral-900 group-hover:text-emerald-700 dark:text-neutral-100 dark:group-hover:text-emerald-400"
            >
              info&#64;vinecore.be
            </p>
          </div>
        </div>
        <span
          aria-hidden="true"
          class="text-xl text-emerald-600 transition group-hover:translate-x-1 dark:text-emerald-400"
        >
          &rarr;
        </span>
      </a>
    </div>
  </div>
</section>
